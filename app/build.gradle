// Autonomer Gradle-Task zum Hochladen der APK und Aktualisieren der Zielversion auf Render
tasks.register("uploadApkToRender") {
    doLast {
        def debugApk = file("${layout.buildDirectory.get()}/outputs/apk/debug/app-debug.apk")
        def releaseApk = file("${layout.buildDirectory.get()}/outputs/apk/release/app-release.apk")
        def apkFile = releaseApk.exists() ? releaseApk : debugApk

        if (!apkFile.exists()) {
            throw new GradleException("❌ APK nicht gefunden unter: ${apkFile.absolutePath}")
        }

        def versionName = android.defaultConfig.versionName
        println("🚀 Lade APK (v$versionName, ${apkFile.length() / (1024 * 1024)} MB) autonom auf Render & Ngrok hoch & setze targetVersion...")

        // Step 1: Warm up Render (Cold Start handling)
        println("☕ Wecke Render Server auf (Warm-up Request)...")
        for (int i = 1; i <= 3; i++) {
            try {
                def healthUrl = new URL("https://albionmarketv2-1.onrender.com/api/health")
                def healthConn = (HttpURLConnection) healthUrl.openConnection()
                healthConn.setRequestMethod("GET")
                healthConn.setConnectTimeout(10000)
                healthConn.setReadTimeout(10000)
                if (healthConn.responseCode == 200) {
                    println("✅ Render Server ist wach und erreichbar!")
                    break
                }
            } catch (Exception e) {
                println("⏳ Versuch $i: Render schläft noch oder startet... (${e.message})")
                sleep(3000)
            }
        }

        // Step 1.5: Kopiere die frisch gebaute APK auch lokal in alle relevanten Projektordner
        try {
            def rootDownloadsDir = file("${rootDir}/downloads")
            if (!rootDownloadsDir.exists()) rootDownloadsDir.mkdirs()
            
            def mainApkCopy = file("${rootDir}/DataPro.apk")
            def downloadsApkCopy = file("${rootDir}/downloads/DataPro.apk")
            def versionedApkCopy = file("${rootDir}/downloads/DataPro_v${versionName}.apk")
            
            mainApkCopy.bytes = apkFile.bytes
            downloadsApkCopy.bytes = apkFile.bytes
            versionedApkCopy.bytes = apkFile.bytes
            
            def versionTxt = file("${rootDir}/downloads/version.txt")
            versionTxt.text = versionName
            
            println("📁 Lokale APKs & version.txt ($versionName) erfolgreich in projektweiten Downloads-Ordner kopiert!")
        } catch (Exception copyEx) {
            println("ℹ️ Konnte lokale Kopien nicht erstellen: ${copyEx.message}")
        }

        // Step 2: Upload APK
        def url = new URL("https://albionmarketv2-1.onrender.com/api/admin/upload-apk?version=$versionName")
        def conn = (HttpURLConnection) url.openConnection()
        conn.setRequestMethod("POST")
        conn.setDoOutput(true)
        conn.setConnectTimeout(60000)
        conn.setReadTimeout(120000)
        
        def boundary = "----AndroidGradleBoundary" + System.currentTimeMillis()
        conn.setRequestProperty("Content-Type", "multipart/form-data; boundary=" + boundary)
        conn.setRequestProperty("Authorization", "Bearer AlbionDataPro_Military_Admin_SuperSecret_2026#Key")
        conn.setRequestProperty("X-Admin-Token", "AlbionDataPro_Military_Admin_SuperSecret_2026#Key")
        conn.setRequestProperty("x-admin-key", "AlbionDataPro_Military_Admin_SuperSecret_2026#Key")
        conn.setRequestProperty("X-Target-Version", versionName)
        
        conn.outputStream.withCloseable { os ->
            os.write(("--" + boundary + "\r\n").getBytes("UTF-8"))
            os.write(("Content-Disposition: form-data; name=\"apkFile\"; filename=\"DataPro.apk\"\r\n").getBytes("UTF-8"))
            os.write(("Content-Type: application/vnd.android.package-archive\r\n\r\n").getBytes("UTF-8"))
            os.write(apkFile.bytes)
            os.write(("\r\n--" + boundary + "--\r\n").getBytes("UTF-8"))
        }
        
        println("📡 Render Server Antwort Code: ${conn.responseCode}")

        if (conn.responseCode != 200) {
            throw new GradleException("❌ UPLOAD FEHLGESCHLAGEN: Render antwortete mit HTTP ${conn.responseCode} (${conn.responseMessage})!")
        } else {
            println("✅ APK & Target-Version v$versionName ERFOLGREICH autonom auf Render bereitgestellt!")
        }
    }
}

