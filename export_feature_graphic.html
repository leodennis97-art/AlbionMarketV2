<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>AlbionDataPro Feature Graphic Export (1024x500 PNG)</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; text-align: center; padding: 30px; }
        .card { background: #1e293b; padding: 30px; border-radius: 16px; display: inline-block; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        button { background: #10b981; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; transition: background 0.2s; }
        button:hover { background: #059669; }
        canvas { border: 1px solid #475569; border-radius: 12px; margin-top: 20px; background: #090d16; width: 512px; height: 250px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>AlbionDataPro - Vorstellungsgrafik (Feature Graphic)</h1>
        <p>Klicke auf den Button, um die vom Google Play Store geforderte <strong>1024x500 PNG-Vorstellungsgrafik</strong> herunterzuladen.</p>
        <br>
        <canvas id="canvas" width="1024" height="500"></canvas>
        <br>
        <button id="downloadBtn">📥 Vorstellungsgrafik als PNG herunterladen</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Background Gradient
        const bgGrad = ctx.createLinearGradient(0, 0, 1024, 500);
        bgGrad.addColorStop(0, '#090d16');
        bgGrad.addColorStop(0.5, '#0f172a');
        bgGrad.addColorStop(1, '#1e293b');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, 1024, 500);

        // Decorative Glow
        const glow = ctx.createRadialGradient(512, 250, 50, 512, 250, 400);
        glow.addColorStop(0, 'rgba(6, 182, 212, 0.15)');
        glow.addColorStop(1, 'transparent');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, 1024, 500);

        // Draw Shield / Logo icon simplified on the left
        ctx.save();
        ctx.translate(180, 250);
        ctx.scale(2.2, 2.2);

        // Shield path
        ctx.beginPath();
        ctx.moveTo(0, -56);
        ctx.lineTo(48, -36);
        ctx.lineTo(48, 4);
        ctx.bezierCurveTo(48, 28, 0, 52, 0, 52);
        ctx.bezierCurveTo(0, 52, -48, 28, -48, 4);
        ctx.lineTo(-48, -36);
        ctx.closePath();
        ctx.fillStyle = '#1E293B';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#06B6D4';
        ctx.stroke();
        ctx.restore();

        // Title & Subtitle text on the right
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 64px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('AlbionDataPro', 340, 210);

        // Gradient Subtitle
        const textGrad = ctx.createLinearGradient(340, 240, 850, 240);
        textGrad.addColorStop(0, '#38bdf8');
        textGrad.addColorStop(1, '#34d399');
        ctx.fillStyle = textGrad;
        ctx.font = '800 28px sans-serif';
        ctx.fillText('Das ultimative In-Game Markt-Overlay', 340, 265);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '600 20px sans-serif';
        ctx.fillText('Arbitrage Radar • Live-Preise • Silber Rechner • 24/7 Cloud', 340, 315);

        // Download event
        document.getElementById('downloadBtn').addEventListener('click', function () {
            const link = document.createElement('a');
            link.download = 'AlbionDataPro_FeatureGraphic_1024x500.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
