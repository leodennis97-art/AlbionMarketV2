<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>DataPro Logo Export (512x512 PNG)</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; text-align: center; padding: 50px; }
        .card { background: #1e293b; padding: 40px; border-radius: 16px; display: inline-block; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        button { background: #10b981; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; transition: background 0.2s; }
        button:hover { background: #059669; }
        canvas { border: 1px solid #475569; border-radius: 12px; margin-top: 20px; background: #0f172a; width: 256px; height: 256px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>DataPro - Market Companion Logo Export</h1>
        <p>Klicke auf den Button, um das Logo als hochauflösendes <strong>512x512 PNG-Bild</strong> für den Google Play Store herunterzuladen.</p>
        <br>
        <canvas id="canvas" width="512" height="512"></canvas>
        <br>
        <button id="downloadBtn">📥 Logo als PNG herunterladen</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const svgString = `<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 128 128">
            <path d="M64,6 L112,28 L112,76 L64,122 L16,76 L16,28 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="4" />
            <path d="M64,14 L104,32 L104,72 L64,110 L24,72 L24,32 Z" fill="#1E293B" stroke="#F59E0B" stroke-width="2" />
            <path d="M36,42 L52,42 C64,42 70,48 70,58 C70,68 64,74 52,74 L36,74 Z" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
            <path d="M72,86 L72,42 L88,42 C96,42 100,46 100,52 C100,58 96,62 88,62 L72,62" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
            <path d="M32,82 L48,68 L64,78 L96,46" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
            <path d="M84,46 L96,46 L96,58" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
            <circle cx="48" cy="68" r="3" fill="#38BDF8" />
            <circle cx="64" cy="78" r="3" fill="#F59E0B" />
            <circle cx="96" cy="46" r="4" fill="#10B981" />
        </svg>`;

        const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
        const URL = window.URL || window.webkitURL || window;
        const blobURL = URL.createObjectURL(blob);
        const img = new Image();

        img.onload = function () {
            ctx.drawImage(img, 0, 0, 512, 512);
            URL.revokeObjectURL(blobURL);
        };
        img.src = blobURL;

        document.getElementById('downloadBtn').addEventListener('click', function () {
            const link = document.createElement('a');
            link.download = 'DataPro_Logo_512x512.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
