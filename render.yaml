version: "1"

services:
  - type: web
    name: albionmarketv2-1
    runtime: node
    repo: https://github.com/leodennis97-art/AlbionMarketV2
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    autoDeployTrigger: commit
    domains:
      - datapro.com
      - www.datapro.com
    healthCheckPath: /api/health
    disk:
      name: datapro-storage
      mountPath: /opt/render/project/src/downloads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: SERVER_HMAC_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        sync: false
      - key: NGROK_AUTHTOKEN
        sync: false
